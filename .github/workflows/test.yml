name: Test

# Every package's tests, on each pull request and each push to master.
# The repository is public, so GitHub-hosted runners cost nothing.
on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: parcae_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      # Backend and root tests each make their own schema here; the
      # analytics integration test uses the server's default database.
      PARCAE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/parcae_test
      ANALYTICS_TEST_DB: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # --continue: one run reports every failing package, not the first.
      - run: pnpm test --continue
